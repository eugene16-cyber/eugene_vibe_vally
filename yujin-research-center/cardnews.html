<!doctype html>
<html lang="ko">
<head>
<script src="assets/gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드뉴스 · 유진 Insight Lab</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/app.css?v=20261029e">
<link rel="stylesheet" href="assets/cardnews/cardnews.css?v=20261029c">
<style>
  .cnp{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:40px;align-items:start;padding-top:24px;padding-bottom:24px}
  .cnp .cnv__frame{max-width:100%}
  .cnp__title{font-size:var(--text-title);font-weight:800;letter-spacing:-.02em;line-height:1.3;color:var(--ink-900)}
  .cnp__acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  body.is-export{background:#e9ecf1}
  body.is-export .cnp-export{padding:24px 0}
  @media (max-width:768px){ .cnp{grid-template-columns:1fr;gap:24px} }
</style>
<script src="assets/config.js?v=20261029a"></script>
<script src="assets/config.local.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script src="assets/partials.js?v=20261029a" defer></script>
<script src="assets/saved-research.js?v=20261029c" defer></script>
<script src="assets/cardnews/cardnews.js?v=20261029c" defer></script>
</head>
<body data-page-title="카드뉴스">
<script>
  // ?export=1 — chrome 없이 슬라이드를 원본 크기(1080×1350)로 세로 나열 (PNG 캡처용)
  if (/[?&]export=1\b/.test(location.search)) { document.body.setAttribute('data-chrome', 'none'); document.body.classList.add('is-export'); }
</script>
<main id="main"><div class="wrap" id="cnp-root"><p class="muted" style="padding:40px 0">카드뉴스를 불러오는 중이에요…</p></div></main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var root = document.getElementById('cnp-root');
  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || qs.get('cn'), file = qs.get('file'), exp = qs.get('export') === '1';

  function getRow() {
    // ?file= — 같은 사이트 안의 deck JSON만 (외부 주소 거부)
    if (file) {
      if (!/^[\w./-]+\.json$/.test(file) || /\.\./.test(file)) return Promise.reject(new Error('허용되지 않는 파일 경로'));
      return fetch(file).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) { return d.deck ? d : { id: file, deck: d }; });
    }
    var sample = CardNews.SAMPLES.filter(function (c) { return !id || c.id === id; })[0];
    if (!id || /^ex-/.test(id) || !window.sb) return Promise.resolve(sample || null);
    return sb.from('card_news').select('*').eq('id', id).maybeSingle()
      .then(function (r) { return (r && r.data) || null; }, function () { return null; });
  }

  function paint(row) {
    if (!row) { root.innerHTML = '<p class="muted" style="padding:40px 0">요청한 카드뉴스를 찾지 못했어요. <a class="btn btn--text" href="home.html#cardnews">Home 카드뉴스 →</a></p>'; return; }
    var c = CardNews.normalize(row), n = (c.deck.slides || []).length, cur = 0;
    if (exp) { root.className = 'cnp-export'; CardNews.render(root, c.deck, { all: true, export: true }); return; }
    root.className = 'wrap cnp';
    root.innerHTML =
      '<div class="cnv__stage"><div class="cnv__frame" id="cnp-frame"></div>' +
        '<div class="cnv__nav"><button type="button" class="cnv__arrow" data-step="-1" aria-label="이전 슬라이드">←</button>' +
        '<div class="cnv__dots">' + c.deck.slides.map(function (_, i) { return '<button type="button" class="cnv__dot" data-go="' + i + '" aria-label="' + (i + 1) + '번 슬라이드"></button>'; }).join('') + '</div>' +
        '<button type="button" class="cnv__arrow" data-step="1" aria-label="다음 슬라이드">→</button></div>' +
        '<p class="sr-only" aria-live="polite" id="cnp-live"></p></div>' +
      '<div><div class="cnv__badges"><span class="badge badge--brand">' + esc(CardNews.BUCKET_LABEL[CardNews.bucket(c.category)]) + '</span>' + (c.sample ? '<span class="badge badge--sample">예시</span>' : '') + '</div>' +
        '<h2 class="cnp__title" style="margin-top:12px">' + esc(c.title) + '</h2>' +
        '<p class="cnv__meta">' + esc([c.team, c.analyst].filter(Boolean).join(' · ')) + ' · <span class="num">' + esc(String(c.published_at).slice(0, 10).replace(/-/g, '.')) + '</span></p>' +
        '<div class="cnp__acts"><a class="btn btn--primary btn--sm" href="home.html?cn=' + encodeURIComponent(c.id) + '">Home에서 보기</a>' +
        '<a class="btn btn--secondary btn--sm" href="?' + (file ? 'file=' + encodeURIComponent(file) : 'id=' + encodeURIComponent(c.id)) + '&export=1">세로로 펼쳐 보기</a></div></div>';
    var frame = document.getElementById('cnp-frame');
    function go(i) {
      cur = (i + n) % n;
      CardNews.render(frame, c.deck, { slide: cur });
      $$('.cnv__dot', root).forEach(function (d, k) { d.setAttribute('aria-current', k === cur ? 'true' : 'false'); });
      document.getElementById('cnp-live').textContent = (cur + 1) + ' / ' + n + ' 슬라이드';
    }
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-go],[data-step]'); if (!t) return;
      go(t.hasAttribute('data-go') ? +t.getAttribute('data-go') : cur + +t.getAttribute('data-step'));
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); });
    var sx = null;
    frame.addEventListener('pointerdown', function (e) { sx = e.clientX; });
    frame.addEventListener('pointerup', function (e) { if (sx == null) return; var dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); });
    go(0);
  }

  getRow().then(paint, function (e) { console.warn('[cardnews]', e && e.message); paint(null); });
});
</script>
</body>
</html>
