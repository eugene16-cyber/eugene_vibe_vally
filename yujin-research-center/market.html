<!doctype html>
<html lang="ko">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/desk.css?v=20261029c">
<script src="assets/config.js?v=20261029a"></script>
<script src="assets/config.local.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>

<script src="assets/events-data.js?v=20261029c" defer></script>
<script src="assets/conf-records.js?v=20261029c" defer></script>

<body data-page-eyebrow="RESEARCH" data-page-title="Research" data-page-desc="리포트 핵심을 카드뉴스로 넘겨 보고, 마음에 드는 자료는 ☆로 저장해 두세요. 저장한 리서치와 행사 신청 내역도 여기서 확인해요.">
<main id="main">

  <!-- 3. 카드뉴스 -->
  <section class="section section--gray desk-sec" id="cardnews">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-eyebrow">CARD NEWS</div>
        <h2 class="sec-title">오늘의 리서치, 카드 한 장으로</h2>
        <p class="sec-sub">리포트의 핵심 숫자를 카드 몇 장으로 정리했어요. 카드를 누르면 넘겨 볼 수 있어요.</p>
      </div>
      <div class="tabs" role="tablist" aria-label="카드뉴스 분류" id="cn-tabs">
        <button role="tab" aria-selected="true" data-tab="rec" aria-controls="cn-grid">추천</button>
        <button role="tab" aria-selected="false" data-tab="market" aria-controls="cn-grid">시황·전략</button>
        <button role="tab" aria-selected="false" data-tab="industry" aria-controls="cn-grid">산업·테마</button>
        <button role="tab" aria-selected="false" data-tab="company" aria-controls="cn-grid">기업 리포트</button>
      </div>
      <div class="cn-grid" id="cn-grid" role="tabpanel" aria-label="카드뉴스 목록"></div>
      <div class="cn-more"><button type="button" class="btn btn--text" id="cn-more" aria-expanded="false">카드뉴스 전체 보기 →</button></div>
    </div>
  </section>

  <!-- 4. 나의 리서치 | 내 이벤트 신청 내역 -->
  <section class="section desk-sec" id="history">
    <div class="wrap desk-two">
      <article class="card" id="research">
        <div class="card__body">
          <div class="ws-h"><h3>나의 리서치</h3></div>
          <div class="tabs" role="tablist" aria-label="나의 리서치" id="rs-tabs">
            <button role="tab" aria-selected="true" data-tab="saved" aria-controls="rs-list">저장한 리서치</button>
            <button role="tab" aria-selected="false" data-tab="received" aria-controls="rs-list">받은 자료</button>
          </div>
          <div class="chips rs-chips" id="rs-chips" role="group" aria-label="카테고리"></div>
          <ul class="rs-list" id="rs-list" role="tabpanel" aria-label="나의 리서치 목록"></ul>
          <button type="button" class="btn btn--text" id="rs-more" hidden>전체 보기 →</button>
        </div>
      </article>
      <article class="card" id="events">
        <div class="card__body">
          <div class="ws-h"><h3>내 이벤트 신청 내역</h3><a class="btn btn--text" href="conferences.html">Events →</a></div>
          <div class="tabs" role="tablist" aria-label="이벤트 신청 내역" id="ev-tabs">
            <button role="tab" aria-selected="true" data-tab="up" aria-controls="ev-list">다가오는 행사</button>
            <button role="tab" aria-selected="false" data-tab="past" aria-controls="ev-list">지난 행사</button>
          </div>
          <ul class="ev-list" id="ev-list" role="tabpanel" aria-label="이벤트 신청 목록"></ul>
        </div>
      </article>
    </div>
  </section>
</main>
</body>
</html>
