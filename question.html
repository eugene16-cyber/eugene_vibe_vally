<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>리서치 라운지 가입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 채팅 스레드(좌) + 실시간 프로필·DB 행 미리보기(우), 폰에서는 세로로 쌓임 */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --line: #d9dfe5;
  --fg: #16202a;
  --muted: #5d6b78;
  --accent: #1f5c7a;
  --accent-soft: #e2edf3;
  --accent-fg: #ffffff;
  --user: #1f5c7a;
  --user-fg: #ffffff;
  --warn-bg: #fff4d6;
  --warn-fg: #6b4e00;
  --ok: #2d7a4f;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #172029; --surface-2: #1d2832; --line: #2c3946;
    --fg: #e4eaf0; --muted: #94a3b1; --accent: #6fb3d6; --accent-soft: #1f3442; --accent-fg: #0b1620;
    --user: #2b6d8f; --user-fg: #f2f8fb; --warn-bg: #3a3014; --warn-fg: #f0d68a; --ok: #6cc596;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #172029; --surface-2: #1d2832; --line: #2c3946;
  --fg: #e4eaf0; --muted: #94a3b1; --accent: #6fb3d6; --accent-soft: #1f3442; --accent-fg: #0b1620;
  --user: #2b6d8f; --user-fg: #f2f8fb; --warn-bg: #3a3014; --warn-fg: #f0d68a; --ok: #6cc596;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.demo-banner {
  background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 8px 14px;
  font-size: 13px; font-weight: 500; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.demo-banner strong { font-weight: 700; letter-spacing: .02em; }
header.top { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header.top h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
header.top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* chat */
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; height: clamp(520px, 78vh, 780px); min-width: 0; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.steps { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.steps .dot { width: 26px; height: 4px; border-radius: 2px; background: var(--line); }
.steps .dot.done { background: var(--accent); }
.steps .dot.cur { background: var(--accent); opacity: .45; }
.head-actions { display: flex; gap: 6px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.ghost:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
.ghost:disabled { opacity: .4; cursor: default; }

.thread { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-top-left-radius: 4px; }
.msg.user { background: var(--user); color: var(--user-fg); align-self: flex-end; border-top-right-radius: 4px; }
.msg.note { align-self: center; max-width: 92%; background: var(--accent-soft); color: var(--fg); font-size: 13px; border-radius: 8px; padding: 6px 12px; }
.msg .qid { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-bottom: 2px; letter-spacing: .03em; }
.typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 6px; }

.done-card { align-self: stretch; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.done-card h3 { margin: 0; font-size: 16px; color: var(--ok); }
.done-card dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
.done-card dt { color: var(--muted); }
.done-card dd { margin: 0; }

/* composer */
.composer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.opt-group .glabel { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.corp-hit { display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; gap: 0; }
.corp-hit:hover { border-color: var(--accent); }
.corp-hit small { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; }
.primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 600; white-space: nowrap; }
.primary:disabled { opacity: .45; cursor: default; }
.hint { font-size: 12px; color: var(--muted); }

/* profile panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.node { font-family: var(--font-mono); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px; }
.node span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.node span.cur { border-color: var(--accent); color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; }
.empty { color: var(--muted); font-size: 13px; }
.dbrow { overflow-x: auto; }
.dbrow table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.dbrow th { text-align: left; font-family: var(--font-mono); font-weight: 500; color: var(--muted); padding: 5px 10px 5px 0; vertical-align: top; white-space: nowrap; }
.dbrow td { font-family: var(--font-mono); padding: 5px 0; border-bottom: 1px dashed var(--line); word-break: break-all; }
.dbrow tr:last-child td { border-bottom: 0; }
.dbrow .null { color: var(--muted); opacity: .6; }
.panel .foot { font-size: 12px; color: var(--muted); }

@media (max-width: 520px) { .msg { max-width: 92%; } .steps .dot { width: 16px; } }
@media (prefers-reduced-motion: no-preference) { .msg { animation: rise .18s ease-out; } }
@keyframes rise { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
</style>

<div class="wrap">
  <div class="demo-banner" role="note"><strong>시연용 가상 화면</strong><span>모든 법인·데이터는 가상이며, 투자 권유나 종목 추천 목적이 아닙니다.</span></div>
  <header class="top">
    <div>
      <h1>리서치 라운지 회원가입</h1>
      <p>질문 5개로 필요한 리포트·세미나·알림을 맞춰 드립니다.</p>
    </div>
  </header>

  <div class="grid">
    <section class="chat" aria-label="가입 대화">
      <div class="chat-head">
        <div class="steps" id="steps" aria-live="polite"></div>
        <div class="head-actions">
          <button class="ghost" id="undoBtn" type="button">이전 질문</button>
          <button class="ghost" id="resetBtn" type="button">처음부터</button>
        </div>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div id="opts"></div>
        <div class="row">
          <input id="freeText" type="text" aria-label="자유 입력">
          <button class="primary" id="sendBtn" type="submit">보내기</button>
        </div>
        <div class="hint" id="hint"></div>
      </form>
    </section>

    <aside class="panel" aria-label="가입 프로필 미리보기">
      <div>
        <h2>질문 경로</h2>
        <div class="node" id="path"></div>
      </div>
      <div>
        <h2>맞춤 서비스 태그</h2>
        <div class="tags" id="tags"></div>
      </div>
      <div>
        <h2>signup_profile 저장 행</h2>
        <div class="dbrow" id="dbrow"></div>
      </div>
      <div class="foot">질문은 FLOW 테이블에서 조건과 빈 슬롯으로 결정됩니다. 자유 입력에서 미리 채운 슬롯의 질문은 건너뜁니다.</div>
    </aside>
  </div>
</div>

<script>
// ---------- 질문 데이터 (signupFlow.ts의 FLOW) ----------
const FLOW = [
  { id: "Q1", step: 1, slot: "segment", type: "single",
    text: "어떤 자격으로 가입하시나요?",
    options: [
      { label: "기관·법인 투자자", value: "inst" },
      { label: "개인 투자자", value: "retail" },
    ] },

  // ===== 기관 경로 =====
  { id: "I-Q2", step: 2, slot: "corp", type: "corp_search",
    when: [{ slot: "segment", op: "eq", value: "inst" }],
    text: "법인명 또는 사업자등록번호를 입력해 주세요. 공시 정보로 확인해 드릴게요." },
  { id: "I-Q3", step: 3, slot: "aum_purpose", type: "single",
    when: [{ slot: "segment", op: "eq", value: "inst" }],
    text: "운용 예정 규모는 어느 정도인가요?",
    options: [
      { label: "100억 미만", value: "lt10b" },
      { label: "100억~500억", value: "10b_50b" },
      { label: "500억~1천억", value: "50b_100b" },
      { label: "1천억 이상", value: "gt100b" },
    ] },
  { id: "I-Q4", step: 4, slot: "needs", type: "multi",
    when: [{ slot: "segment", op: "eq", value: "inst" }],
    text: "가장 필요한 서비스를 골라주세요. (복수 선택)",
    options: [
      { label: "섹터 리포트", value: "report", tags: ["need:report"] },
      { label: "애널리스트 세미나·NDR", value: "seminar", tags: ["need:seminar"] },
      { label: "기업탐방·IR 미팅 주선", value: "ir", tags: ["need:ir"] },
      { label: "IPO·블록딜 등 IB 정보", value: "ib", tags: ["need:ib"] },
      { label: "공시·이슈 알림", value: "alert", tags: ["need:alert"] },
    ] },
  { id: "I-Q5-SEMINAR", step: 5, slot: "detail", type: "multi", priority: 30,
    when: [{ slot: "segment", op: "eq", value: "inst" },
           { slot: "needs", op: "includes", value: "seminar" }],
    text: "세미나를 원하시는 섹터와 선호 형식을 알려주세요.",
    options: [
      { label: "바이오·헬스케어", value: "bio", field: "sector" },
      { label: "반도체", value: "semi", field: "sector" },
      { label: "2차전지", value: "battery", field: "sector" },
      { label: "대면 세미나", value: "offline", field: "format" },
      { label: "온라인 세미나", value: "online", field: "format" },
    ] },
  { id: "I-Q5-IB", step: 5, slot: "detail", type: "multi", priority: 20,
    when: [{ slot: "segment", op: "eq", value: "inst" },
           { slot: "needs", op: "includes", value: "ib" }],
    text: "관심 있는 딜 유형을 골라주세요.",
    options: [
      { label: "바이오·헬스케어", value: "bio", field: "sector" },
      { label: "반도체", value: "semi", field: "sector" },
      { label: "2차전지", value: "battery", field: "sector" },
      { label: "IPO", value: "ipo", field: "deal_type" },
      { label: "메자닌(CB·BW)", value: "mezz", field: "deal_type" },
      { label: "블록딜", value: "block", field: "deal_type" },
    ] },
  { id: "I-Q5-DEFAULT", step: 5, slot: "detail", type: "multi", priority: 0,
    when: [{ slot: "segment", op: "eq", value: "inst" }],
    text: "관심 섹터와 정보 수신 주기를 알려주세요.",
    options: [
      { label: "바이오·헬스케어", value: "bio", field: "sector" },
      { label: "반도체", value: "semi", field: "sector" },
      { label: "2차전지", value: "battery", field: "sector" },
      { label: "주 1회", value: "weekly", field: "frequency" },
      { label: "월 1회", value: "monthly", field: "frequency" },
    ] },

  // ===== 리테일 경로 =====
  { id: "R-Q2", step: 2, slot: "experience", type: "single",
    when: [{ slot: "segment", op: "eq", value: "retail" }],
    text: "투자 경험은 어느 정도이신가요?",
    options: [
      { label: "처음이에요", value: "none" },
      { label: "1~3년", value: "1_3y" },
      { label: "3년 이상", value: "gt3y" },
      { label: "전업 수준", value: "pro" },
    ] },
  { id: "R-Q3", step: 3, slot: "budget", type: "single",
    when: [{ slot: "segment", op: "eq", value: "retail" }],
    text: "투자 예정 자금 규모는 어느 정도인가요?",
    options: [
      { label: "1천만 원 미만", value: "lt10m" },
      { label: "1천만~1억 원", value: "10m_100m" },
      { label: "1억 원 이상", value: "gt100m" },
    ] },
  { id: "R-Q4", step: 4, slot: "needs", type: "multi",
    when: [{ slot: "segment", op: "eq", value: "retail" }],
    text: "어떤 도움이 가장 필요하신가요? (복수 선택)",
    options: [
      { label: "관심 분야 이슈 알림", value: "alert" },
      { label: "쉬운 리포트 요약", value: "summary" },
      { label: "웨비나", value: "webinar" },
      { label: "1:1 상담", value: "consult" },
    ] },
  { id: "R-Q5", step: 5, slot: "detail", type: "multi",
    when: [{ slot: "segment", op: "eq", value: "retail" }],
    text: "관심 섹터와 정보 수신 주기를 알려주세요.",
    options: [
      { label: "바이오·헬스케어", value: "bio", field: "sector" },
      { label: "반도체", value: "semi", field: "sector" },
      { label: "2차전지", value: "battery", field: "sector" },
      { label: "배당·인컴", value: "dividend", field: "sector" },
      { label: "주 1회", value: "weekly", field: "frequency" },
      { label: "월 1회", value: "monthly", field: "frequency" },
    ] },
];

// ---------- 엔진 ----------
function matches(c, p) {
  const v = p[c.slot];
  if (v === undefined) return false;
  switch (c.op) {
    case "eq": return v === c.value;
    case "neq": return v !== c.value;
    case "includes": return Array.isArray(v) ? v.includes(c.value) : v === c.value;
  }
}

function getNextQuestion(profile, flow = FLOW) {
  for (let step = 1; step <= 5; step++) {
    const candidates = flow
      .filter(q => q.step === step)
      .filter(q => (q.when ?? []).every(c => matches(c, profile)))
      .sort((a, b) => (b.priority ?? 0) - (a.priority ?? 0));
    const q = candidates[0];
    if (!q) continue;
    if (profile[q.slot] !== undefined) continue; // 이미 채워진 슬롯은 건너뜀
    return q;
  }
  return null;
}

function applyAnswer(profile, q, answer) {
  const values = Array.isArray(answer) ? answer : [answer];
  const newTags = (q.options ?? []).filter(o => values.includes(o.value)).flatMap(o => o.tags ?? []);
  const tags = [...(profile.tags ?? []), ...newTags];
  const byField = {};
  for (const o of q.options ?? []) {
    if (!o.field || !values.includes(o.value)) continue;
    byField[o.field] = [...(byField[o.field] ?? []), o.value];
  }
  return { ...profile, [q.slot]: answer, ...byField, tags };
}

// 자유 입력 → 슬롯 추출 (시연은 키워드 매칭으로 대체)
const KEYWORDS = {
  needs: [["세미나", "seminar"], ["리포트", "report"], ["알림", "alert"], ["상담", "consult"]],
  detail: [["바이오", "bio"], ["반도체", "semi"], ["2차전지", "battery"]],
};
function extractSlots(text) {
  const out = {};
  for (const [slot, pairs] of Object.entries(KEYWORDS)) {
    const hit = pairs.filter(([kw]) => text.includes(kw)).map(([, v]) => v);
    if (hit.length) out[slot] = hit;
  }
  return out;
}

// 법인 검색 (시연용 가상 데이터)
const MOCK_CORPS = [
  { name: "가나다자산운용(가상)", bizNo: "000-00-00001", industry: "집합투자업" },
  { name: "라마바바이오(가상)", bizNo: "000-00-00002", industry: "의약품 제조업" },
];
function searchCorp(query) {
  return MOCK_CORPS.filter(c => c.name.includes(query) || c.bizNo === query);
}

// ---------- 화면 ----------
const LABELS = {};
for (const q of FLOW) for (const o of q.options ?? []) LABELS[o.value] = o.label;
const FIELD_LABELS = { sector: "관심 섹터", format: "세미나 형식", frequency: "수신 주기", deal_type: "딜 유형" };

const $ = id => document.getElementById(id);
const els = { thread: $("thread"), opts: $("opts"), text: $("freeText"), send: $("sendBtn"),
  hint: $("hint"), steps: $("steps"), path: $("path"), tags: $("tags"), dbrow: $("dbrow"),
  undo: $("undoBtn"), reset: $("resetBtn"), form: $("composer") };

let state, history;

function init() {
  state = { profile: {}, msgs: [], path: [], current: null, selected: [], corpHits: null, createdAt: null };
  history = [];
  pushMsg("bot", "안녕하세요. 몇 가지만 여쭤보고 필요한 리서치 서비스를 맞춰 드릴게요.\n선택지를 누르거나, 원하는 내용을 편하게 적어 주셔도 됩니다.");
  advance();
}

function snapshot() { history.push(JSON.parse(JSON.stringify(state))); }

function pushMsg(who, text, extra) { state.msgs.push({ who, text, ...extra }); }

function labelOf(v) {
  if (Array.isArray(v)) return v.map(labelOf).join(", ");
  return LABELS[v] ?? v;
}

function advance() {
  const q = getNextQuestion(state.profile);
  state.current = q;
  state.selected = [];
  state.corpHits = null;
  if (q) {
    if (!state.path.includes(q.id)) state.path.push(q.id);
    pushMsg("bot", q.text, { qid: q.id });
  } else {
    state.createdAt = new Date().toISOString().slice(0, 19).replace("T", " ");
    pushMsg("done", "");
  }
  render();
}

function answer(value, displayText) {
  const q = state.current;
  if (!q) return;
  snapshot();
  pushMsg("user", displayText ?? labelOf(value));
  state.profile = applyAnswer(state.profile, q, value);
  advance();
}

function handleFreeText(text) {
  const q = state.current;
  if (!q) return;

  if (q.type === "corp_search") {
    snapshot();
    pushMsg("user", text);
    const hits = searchCorp(text.trim());
    state.corpHits = hits;
    pushMsg("bot", hits.length
      ? `${hits.length}건을 찾았어요. 맞는 법인을 선택해 주세요.`
      : "일치하는 법인을 찾지 못했어요. 법인명 일부나 사업자등록번호(000-00-00000)로 다시 입력해 주세요.");
    render();
    return;
  }

  snapshot();
  pushMsg("user", text);
  const extracted = extractSlots(text);

  // 1) 다른 질문의 빈 슬롯을 미리 채움 → 해당 질문은 엔진이 건너뜀
  const filled = [];
  for (const [slot, vals] of Object.entries(extracted)) {
    if (state.profile[slot] !== undefined || slot === q.slot) continue;
    const tags = FLOW.filter(fq => fq.slot === slot).flatMap(fq => fq.options ?? [])
      .filter(o => vals.includes(o.value)).flatMap(o => o.tags ?? []);
    state.profile = { ...state.profile, [slot]: vals,
      tags: [...new Set([...(state.profile.tags ?? []), ...tags])] };
    if (slot === "detail") state.profile.sector = vals;
    filled.push(labelOf(vals));
  }
  if (filled.length) pushMsg("note", `「${filled.join(", ")}」은(는) 미리 저장해 두고, 해당 질문은 건너뛸게요.`);

  // 2) 현재 질문의 답: 선택지 라벨 단어 매칭 + 키워드 추출
  let values = matchOptions(q, text);
  if (!values.length && extracted[q.slot]) {
    values = extracted[q.slot].filter(v => (q.options ?? []).some(o => o.value === v));
  }
  if (q.type === "single" && values.length !== 1) values = [];

  if (values.length) {
    pushMsg("note", `입력하신 내용에서 「${labelOf(values)}」을(를) 선택했어요.`);
    state.profile = applyAnswer(state.profile, q, q.type === "single" ? values[0] : values);
    advance();
    return;
  }
  if (filled.length) {
    advance();   // 현재 질문을 다시 묻거나, 이미 채워졌다면 다음으로
    return;
  }
  pushMsg("bot", "선택지와 맞는 내용을 찾지 못했어요. 아래에서 골라 주시거나 조금 다르게 적어 주세요.");
  render();
}

// 라벨을 단어로 쪼갠 뒤, 이 질문의 다른 선택지와 겹치지 않는 단어만 매칭에 사용
function matchOptions(q, text) {
  const words = o => o.label.split(/[·()\s~]/).filter(w => w.length >= 2);
  const count = {};
  for (const o of q.options ?? []) for (const w of new Set(words(o))) count[w] = (count[w] ?? 0) + 1;
  return (q.options ?? [])
    .filter(o => text.includes(o.label) || words(o).some(w => count[w] === 1 && text.includes(w)))
    .map(o => o.value);
}

// ---------- 렌더 ----------
function render() {
  renderThread();
  renderComposer();
  renderPanel();
  renderSteps();
  els.undo.disabled = history.length === 0;
}

function renderSteps() {
  const q = state.current;
  const curStep = q ? q.step : 6;
  const dots = [1, 2, 3, 4, 5].map(s =>
    `<span class="dot ${s < curStep ? "done" : s === curStep ? "cur" : ""}"></span>`).join("");
  els.steps.innerHTML = dots + `<span>${q ? `${q.step} / 5` : "완료"}</span>`;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderThread() {
  els.thread.innerHTML = state.msgs.map(m => {
    if (m.who === "done") return doneCard();
    const qid = m.qid ? `<span class="qid">${esc(m.qid)}</span>` : "";
    return `<div class="msg ${m.who}">${qid}${esc(m.text)}</div>`;
  }).join("");
  els.thread.scrollTop = els.thread.scrollHeight;
}

function doneCard() {
  const p = state.profile;
  const rows = [["가입 유형", labelOf(p.segment)]];
  if (p.corpName) rows.push(["법인", p.corpName]);
  if (p.aum_purpose) rows.push(["운용 예정 규모", labelOf(p.aum_purpose)]);
  if (p.experience) rows.push(["투자 경험", labelOf(p.experience)]);
  if (p.budget) rows.push(["자금 규모", labelOf(p.budget)]);
  if (p.needs) rows.push(["필요 서비스", labelOf(p.needs)]);
  for (const f of Object.keys(FIELD_LABELS)) if (p[f]) rows.push([FIELD_LABELS[f], labelOf(p[f])]);
  return `<div class="done-card"><h3>가입이 완료되었어요</h3>
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="hint">선택하신 관심사를 기준으로 리포트·세미나·알림 수신 설정이 구성됩니다. 마이페이지에서 언제든 바꿀 수 있어요.</div></div>`;
}

function renderComposer() {
  const q = state.current;
  els.opts.innerHTML = "";
  els.text.disabled = !q;
  els.send.disabled = !q;
  if (!q) {
    els.text.placeholder = "가입이 완료되었습니다";
    els.hint.textContent = "처음부터를 눌러 다른 경로를 시연할 수 있어요.";
    return;
  }

  if (q.type === "corp_search") {
    els.text.placeholder = "예: 가나다, 000-00-00002";
    els.hint.textContent = "시연용 가상 법인: 가나다자산운용(가상), 라마바바이오(가상)";
    if (state.corpHits?.length) {
      const box = document.createElement("div");
      box.className = "opts";
      for (const c of state.corpHits) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "corp-hit";
        b.innerHTML = `<span>${esc(c.name)} · ${esc(c.industry)}</span><small>${esc(c.bizNo)}</small>`;
        b.onclick = () => {
          snapshot();
          pushMsg("user", c.name);
          state.profile = applyAnswer(state.profile, q, c.bizNo);
          state.profile.corpName = c.name;
          advance();
        };
        box.appendChild(b);
      }
      els.opts.appendChild(box);
    }
    return;
  }

  els.text.placeholder = q.type === "multi"
    ? "선택지 외에 자유롭게 적어도 돼요 (예: 반도체 세미나가 필요해요)"
    : "직접 입력도 가능해요";
  els.hint.textContent = q.type === "multi" ? "여러 개를 고른 뒤 선택 완료를 눌러 주세요." : "";

  // field가 있으면 그룹별로 나눠 보여줌
  const groups = {};
  for (const o of q.options ?? []) (groups[o.field ?? ""] ??= []).push(o);
  for (const [field, opts] of Object.entries(groups)) {
    const g = document.createElement("div");
    g.className = "opt-group";
    if (field) g.innerHTML = `<span class="glabel">${esc(FIELD_LABELS[field] ?? field)}</span>`;
    const wrap = document.createElement("div");
    wrap.className = "opts";
    for (const o of opts) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = o.label;
      if (q.type === "multi") {
        b.setAttribute("aria-pressed", state.selected.includes(o.value));
        b.onclick = () => {
          state.selected = state.selected.includes(o.value)
            ? state.selected.filter(v => v !== o.value) : [...state.selected, o.value];
          renderComposer();
        };
      } else {
        b.onclick = () => answer(o.value);
      }
      wrap.appendChild(b);
    }
    g.appendChild(wrap);
    els.opts.appendChild(g);
  }
  if (q.type === "multi") {
    const ok = document.createElement("button");
    ok.type = "button"; ok.className = "primary";
    ok.textContent = state.selected.length ? `선택 완료 (${state.selected.length})` : "선택 완료";
    ok.disabled = state.selected.length === 0;
    ok.style.alignSelf = "flex-start";
    ok.onclick = () => answer([...state.selected]);
    const g = document.createElement("div");
    g.className = "opt-group"; g.appendChild(ok);
    els.opts.appendChild(g);
  }
}

function renderPanel() {
  const cur = state.current?.id;
  els.path.innerHTML = state.path.map(id => `<span class="${id === cur ? "cur" : ""}">${esc(id)}</span>`).join("")
    || `<span class="empty">-</span>`;
  const tags = state.profile.tags ?? [];
  els.tags.innerHTML = tags.length ? tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")
    : `<span class="empty">기관 경로의 필요 서비스를 고르면 태그가 쌓여요.</span>`;

  const p = state.profile;
  const cols = [
    ["segment", p.segment], ["corp_biz_no", p.corp], ["aum_band", p.aum_purpose],
    ["experience", p.experience], ["budget", p.budget],
    ["needs[]", p.needs], ["sector[]", p.sector], ["format[]", p.format],
    ["frequency", p.frequency], ["deal_type[]", p.deal_type], ["tags[]", p.tags?.length ? p.tags : undefined],
    ["created_at", state.createdAt ?? undefined],
  ];
  els.dbrow.innerHTML = `<table>${cols.map(([k, v]) => {
    const val = v === undefined ? `<span class="null">null</span>`
      : esc(Array.isArray(v) ? `{${v.join(",")}}` : v);
    return `<tr><th>${k}</th><td>${val}</td></tr>`;
  }).join("")}</table>`;
}

// ---------- 이벤트 ----------
els.form.addEventListener("submit", e => {
  e.preventDefault();
  const t = els.text.value.trim();
  if (!t) return;
  els.text.value = "";
  handleFreeText(t);
  els.text.focus();
});
els.undo.onclick = () => { if (history.length) { state = history.pop(); render(); } };
els.reset.onclick = init;

init();
</script>

</body></html>
